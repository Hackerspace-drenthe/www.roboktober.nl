services:
  mariadb:
    image: mariadb:11.4
    container_name: roboktober-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: roboktober
      MARIADB_USER: roboktober
      MARIADB_PASSWORD: roboktober
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./roboktober-api
      dockerfile: Dockerfile.dev
    container_name: roboktober-backend
    depends_on:
      mariadb:
        condition: service_healthy
    working_dir: /app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: roboktober
      DB_USERNAME: roboktober
      DB_PASSWORD: roboktober
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./roboktober-api:/app
      - backend_vendor:/app/vendor
    ports:
      - "8000:8000"
    command: >
      bash -lc "
      [ -f .env ] || cp .env.example .env;
      if [ ! -f vendor/autoload.php ]; then
        composer install --no-interaction;
      fi;
      sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env;
      sed -i 's/^DB_HOST=.*/DB_HOST=mariadb/' .env;
      sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env;
      sed -i 's/^DB_DATABASE=.*/DB_DATABASE=roboktober/' .env;
      sed -i 's/^DB_USERNAME=.*/DB_USERNAME=roboktober/' .env;
      sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=roboktober/' .env;
      sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env;
      sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env;
      grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force;
      php artisan config:clear;
      php artisan migrate --force;
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    image: node:24-bookworm-slim
    container_name: roboktober-frontend
    depends_on:
      - backend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./roboktober-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -lc "
      if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi;
      npm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  mariadb_data:
  backend_vendor:
  frontend_node_modules:
